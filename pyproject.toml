[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-greenview-pro"
version = "3.1.0"
description = "Live RAW, NDVI, and CVI visualization for IDS cameras"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "opencv-python",
    "PySide6",
]

[project.scripts]
greenview-pro = "greenview_pro.app:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
ndvi_processing = ["resources/*.csv"]
greenview_pro = ["resources/config.toml", "resources/icons/*", "resources/images/*.jpg", "resources/messages/*.toml"]
calibration = ["config.toml"]
