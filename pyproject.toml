[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-greenview-pro"
version = "3.1.0"
description = "Live RAW, NDVI, and CVI visualization for IDS cameras"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "opencv-python",
    "PySide6",
]

[project.scripts]
greenview-pro = "greenview_pro.app:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.data-files]
"greenview_pro" = ["src/config.toml"]
"greenview_pro/icons" = ["src/icons/*.png"]
"greenview_pro/images" = ["src/images/*.jpg"]
"greenview_pro/messages" = ["src/messages/*.toml"]
